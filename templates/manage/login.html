<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>登录</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'manage/demo/vendor/simple-line-icons/css/simple-line-icons.css' %}">
    <link rel="stylesheet" href="{% static 'manage/demo/vendor/font-awesome/css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'manage/demo/css/styles.css' %}">
<style type="text/css">
.bg{
    background-color: black;
}
.drag{
}
    </style>
</head>
<body>
<div class="bg">
<div class="page-wrapper flex-row align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 drag" style="display: none">
                    <div class="card-header text-center text-uppercase h4 font-weight-light">
                        后台登录
                    </div>
                    <form class="login_form" action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                    <div class="card-body py-5">
                        <div class="form-group">
                            <label class="form-control-label">账号</label>
                            <input type="text" class="form-control" name="account" autofocus="autofocus">
                        </div>

                        <div class="form-group">
                            <label class="form-control-label">密码</label>
                            <input type="password" class="form-control" name="pwd">
                        </div>

                    <div class="card-footer">
                        <div class=" text-center ">
                                <button type="submit" class="btn btn-primary px-5">登录</button>
                        </div>
                    </div>
                </div>
                    </form>
            </div>
        </div>
    </div>
</div></div>
<script src="{% static 'manage/demo/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'manage/js/jquery.form.js' %}"></script>
<script>
$(function () {
    $('.drag').fadeIn();
    $(".login_form").ajaxForm(function(data){
		if(data==="ok"){
			window.location.href='{% url "view_all" %}'
		}
		else {
		    alert("登录失败！");
        }
	});
});

</script>
</body>
</html>
